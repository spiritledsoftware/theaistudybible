name: Remove PR preview

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  AI_CONTEXT_SIZE: ${{ vars.AI_CONTEXT_SIZE }}
  ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
  ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
  APPLE_AUTH_KEY: ${{ secrets.APPLE_AUTH_KEY }}
  APPLE_CLIENT_ID: ${{ vars.APPLE_CLIENT_ID }}
  APPLE_CLIENT_SECRET: ${{ secrets.APPLE_CLIENT_SECRET }}
  APPLE_KEY_ID: ${{ vars.APPLE_KEY_ID }}
  APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  DONATION_LINK: ${{ vars.DONATION_LINK }}
  FREE_CHAT_DAILY_LIMIT: ${{ vars.FREE_CHAT_DAILY_LIMIT }}
  FREE_IMAGE_DAILY_LIMIT: ${{ vars.FREE_IMAGE_DAILY_LIMIT }}
  FREE_SUGGESTION_DAILY_LIMIT: ${{ vars.FREE_SUGGESTION_DAILY_LIMIT }}
  GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_CHAT_MODEL: ${{ vars.OPENROUTER_CHAT_MODEL }}
  OPENROUTER_EMBEDDING_DIMENSIONS: ${{ vars.OPENROUTER_EMBEDDING_DIMENSIONS }}
  OPENROUTER_EMBEDDING_MODEL: ${{ vars.OPENROUTER_EMBEDDING_MODEL }}
  OPENROUTER_IMAGE_MODEL: ${{ vars.OPENROUTER_IMAGE_MODEL }}
  OPENROUTER_RERANK_MODEL: ${{ vars.OPENROUTER_RERANK_MODEL }}
  POSTHOG_API_HOST: ${{ vars.POSTHOG_API_HOST }}
  POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
  PRO_CHAT_DAILY_LIMIT: ${{ vars.PRO_CHAT_DAILY_LIMIT }}
  PRO_IMAGE_DAILY_LIMIT: ${{ vars.PRO_IMAGE_DAILY_LIMIT }}
  PRO_MONTHLY_PRICE_ID: ${{ vars.DEV_PRO_MONTHLY_PRICE_ID }}
  PRO_SUGGESTION_DAILY_LIMIT: ${{ vars.PRO_SUGGESTION_DAILY_LIMIT }}
  PRO_YEARLY_PRICE_ID: ${{ vars.DEV_PRO_YEARLY_PRICE_ID }}
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  SES_ACCESS_KEY_ID: ${{ secrets.SES_ACCESS_KEY_ID }}
  SES_SECRET_ACCESS_KEY: ${{ secrets.SES_SECRET_ACCESS_KEY }}
  STRIPE_SECRET_KEY: ${{ secrets.DEV_STRIPE_SECRET_KEY }}
  STRIPE_WEBHOOK_SECRET: ${{ secrets.DEV_STRIPE_WEBHOOK_SECRET }}
  VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
  VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
  WEB_APP_URL: https://pr-${{ github.event.pull_request.number }}.preview.theaistudybible.com

jobs:
  remove:
    name: Remove preview resources
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: CI setup
        uses: ./.github/actions/ci-setup

      - name: Destroy Cloudflare preview
        run: pnpm exec alchemy destroy alchemy.run.ts --stage pr-${{ github.event.pull_request.number }}
