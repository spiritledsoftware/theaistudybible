name: Remove PR preview

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# Every value is a secret of the `preview` GitHub Environment.
env:
  AI_CONTEXT_SIZE: ${{ secrets.AI_CONTEXT_SIZE }}
  ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
  ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
  APPLE_AUTH_KEY: ${{ secrets.APPLE_AUTH_KEY }}
  APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
  APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  DONATION_LINK: ${{ secrets.DONATION_LINK }}
  FREE_CHAT_DAILY_LIMIT: ${{ secrets.FREE_CHAT_DAILY_LIMIT }}
  FREE_IMAGE_DAILY_LIMIT: ${{ secrets.FREE_IMAGE_DAILY_LIMIT }}
  FREE_SUGGESTION_DAILY_LIMIT: ${{ secrets.FREE_SUGGESTION_DAILY_LIMIT }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_CHAT_MODEL: ${{ secrets.OPENROUTER_CHAT_MODEL }}
  OPENROUTER_EMBEDDING_DIMENSIONS: ${{ secrets.OPENROUTER_EMBEDDING_DIMENSIONS }}
  OPENROUTER_EMBEDDING_MODEL: ${{ secrets.OPENROUTER_EMBEDDING_MODEL }}
  OPENROUTER_IMAGE_MODEL: ${{ secrets.OPENROUTER_IMAGE_MODEL }}
  OPENROUTER_RERANK_MODEL: ${{ secrets.OPENROUTER_RERANK_MODEL }}
  POSTHOG_API_HOST: ${{ secrets.POSTHOG_API_HOST }}
  POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
  PRO_CHAT_DAILY_LIMIT: ${{ secrets.PRO_CHAT_DAILY_LIMIT }}
  PRO_IMAGE_DAILY_LIMIT: ${{ secrets.PRO_IMAGE_DAILY_LIMIT }}
  PRO_SUGGESTION_DAILY_LIMIT: ${{ secrets.PRO_SUGGESTION_DAILY_LIMIT }}
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
  VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
  VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}

jobs:
  remove:
    name: Remove preview resources
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: CI setup
        uses: ./.github/actions/ci-setup

      - name: Destroy Cloudflare preview
        run: pnpm exec alchemy destroy alchemy.run.ts --stage pr-${{ github.event.pull_request.number }}
