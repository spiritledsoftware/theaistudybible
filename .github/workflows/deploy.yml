name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.vscode/**'
      - '.cursor/**'
      - '.husky/**'
  workflow_dispatch:

permissions:
  contents: read

# One pipeline at a time: staging and production deploys never overlap, and a
# queued run waits for the in-flight production deploy instead of cancelling it.
concurrency:
  group: deploy
  cancel-in-progress: false

# Every value is a GitHub Environment secret. Only the `staging` and
# `production` jobs bind an environment, so only they resolve these values.
env:
  AI_CONTEXT_SIZE: ${{ secrets.AI_CONTEXT_SIZE }}
  ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
  ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
  APPLE_AUTH_KEY: ${{ secrets.APPLE_AUTH_KEY }}
  APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
  APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  DONATION_LINK: ${{ secrets.DONATION_LINK }}
  FREE_CHAT_DAILY_LIMIT: ${{ secrets.FREE_CHAT_DAILY_LIMIT }}
  FREE_IMAGE_DAILY_LIMIT: ${{ secrets.FREE_IMAGE_DAILY_LIMIT }}
  FREE_SUGGESTION_DAILY_LIMIT: ${{ secrets.FREE_SUGGESTION_DAILY_LIMIT }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_CHAT_MODEL: ${{ secrets.OPENROUTER_CHAT_MODEL }}
  OPENROUTER_EMBEDDING_DIMENSIONS: ${{ secrets.OPENROUTER_EMBEDDING_DIMENSIONS }}
  OPENROUTER_EMBEDDING_MODEL: ${{ secrets.OPENROUTER_EMBEDDING_MODEL }}
  OPENROUTER_IMAGE_MODEL: ${{ secrets.OPENROUTER_IMAGE_MODEL }}
  OPENROUTER_RERANK_MODEL: ${{ secrets.OPENROUTER_RERANK_MODEL }}
  POSTHOG_API_HOST: ${{ secrets.POSTHOG_API_HOST }}
  POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
  PRO_CHAT_DAILY_LIMIT: ${{ secrets.PRO_CHAT_DAILY_LIMIT }}
  PRO_IMAGE_DAILY_LIMIT: ${{ secrets.PRO_IMAGE_DAILY_LIMIT }}
  PRO_SUGGESTION_DAILY_LIMIT: ${{ secrets.PRO_SUGGESTION_DAILY_LIMIT }}
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
  VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
  VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}

jobs:
  verify:
    name: Verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: CI setup
        uses: ./.github/actions/ci-setup

      - name: Type check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Test
        run: pnpm run test

  staging:
    name: Deploy staging
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: staging
      url: https://staging.theaistudybible.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: CI setup
        uses: ./.github/actions/ci-setup

      - name: Deploy Cloudflare staging
        run: pnpm exec alchemy deploy alchemy.run.ts --stage staging

      - name: Run staging smoke tests
        env:
          WEB_APP_URL: https://staging.theaistudybible.com
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: pnpm run test:e2e

  production:
    name: Deploy production
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://theaistudybible.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: CI setup
        uses: ./.github/actions/ci-setup

      - name: Deploy Cloudflare production
        run: pnpm run deploy

      - name: Run production smoke tests
        env:
          WEB_APP_URL: https://theaistudybible.com
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: pnpm run test:e2e
